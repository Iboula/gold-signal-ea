services:
  postgres:
    image: postgres:17
    container_name: goldsignal-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - goldsignal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-api:
    build:
      context: ./GoldSignal.Ai.Api
      dockerfile: Dockerfile
    container_name: goldsignal-ai-api
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__TradingDb: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Anthropic__Model: ${ANTHROPIC_MODEL}
      Anthropic__Version: ${ANTHROPIC_VERSION}
      Anthropic__MaxTokens: ${ANTHROPIC_MAX_TOKENS}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN}
      Telegram__ChatId: ${TELEGRAM_CHAT_ID}
    ports:
      - "${API_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ./GoldSignal.Dashboard
      dockerfile: Dockerfile
    container_name: goldsignal-dashboard
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ApiBaseUrl: http://ai-api:8080
    ports:
      - "${DASHBOARD_PORT}:8080"
    depends_on:
      - ai-api

volumes:
  goldsignal-postgres-data: