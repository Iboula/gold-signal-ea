services:
  postgres:
    image: postgres:17
    container_name: goldsignal-postgres
    environment:
      POSTGRES_DB: goldsignal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - goldsignal-postgres-data:/var/lib/postgresql/data

  ai-api:
    build:
      context: ./GoldSignal.Ai.Api
      dockerfile: Dockerfile
    container_name: goldsignal-ai-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ConnectionStrings__TradingDb: Host=postgres;Port=5432;Database=goldsignal;Username=postgres;Password=postgres
    ports:
      - "5000:8080"
    depends_on:
      - postgres

volumes:
  goldsignal-postgres-data: